services:
  router:
    image: ghcr.io/apollographql/router:v2.17.0
    ports:
      - "4000:4000"
      - "8088:8088"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./router.yaml:/config/router.yaml:ro
      - ./supergraph.graphql:/config/supergraph.graphql:ro
    command: ["--config", "/config/router.yaml", "--supergraph", "/config/supergraph.graphql"]
